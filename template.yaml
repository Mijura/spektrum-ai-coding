AWSTemplateFormatVersion: "2010-09-09"
Description: Spektrum AI Coding Engine - EC2 with Docker

Parameters:
    VpcId:
        Type: AWS::EC2::VPC::Id
        Description: VPC to deploy into (default VPC)
    SubnetId:
        Type: AWS::EC2::Subnet::Id
        Description: Public subnet for the EC2 instance
    ContainerImage:
        Type: String
        Description: "Full ECR image URI (account.dkr.ecr.region.amazonaws.com/repo:tag)"
        Default: ""
    KeyPairName:
        Type: AWS::EC2::KeyPair::KeyName
        Description: EC2 key pair for SSH access
    InstanceType:
        Type: String
        Default: t3.medium
        AllowedValues:
            - t3.small
            - t3.medium
            - t3.large
        Description: EC2 instance type
    JigjoyApiEndpoint:
        Type: String
        Description: Platform API endpoint URL (e.g. from platform-serverless-api)

Resources:
    # ---- ECR Repository ----
    EcrRepository:
        Type: AWS::ECR::Repository
        Properties:
            RepositoryName: !Ref AWS::StackName
            ImageScanningConfiguration:
                ScanOnPush: true
            LifecyclePolicy:
                LifecyclePolicyText: |
                    {
                        "rules": [
                            {
                                "rulePriority": 1,
                                "description": "Keep only 5 images",
                                "selection": {
                                    "tagStatus": "any",
                                    "countType": "imageCountMoreThan",
                                    "countNumber": 5
                                },
                                "action": {
                                    "type": "expire"
                                }
                            }
                        ]
                    }

    # ---- DynamoDB Table ----
    CodebaseTable:
        Type: AWS::DynamoDB::Table
        Properties:
            TableName: !Sub "${AWS::StackName}-Codebase"
            BillingMode: PAY_PER_REQUEST
            AttributeDefinitions:
                - AttributeName: projectId
                  AttributeType: S
            KeySchema:
                - AttributeName: projectId
                  KeyType: HASH

    # ---- CloudWatch Log Group ----
    LogGroup:
        Type: AWS::Logs::LogGroup
        Properties:
            LogGroupName: !Sub "/ec2/${AWS::StackName}"
            RetentionInDays: 14

    # ---- IAM Role for EC2 ----
    Ec2Role:
        Type: AWS::IAM::Role
        Properties:
            RoleName: !Sub "${AWS::StackName}-ec2-role"
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: ec2.amazonaws.com
                      Action: sts:AssumeRole
            ManagedPolicyArns:
                - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
            Policies:
                - PolicyName: ecr-pull
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action:
                                - ecr:GetAuthorizationToken
                            Resource: "*"
                          - Effect: Allow
                            Action:
                                - ecr:BatchGetImage
                                - ecr:GetDownloadUrlForLayer
                                - ecr:BatchCheckLayerAvailability
                            Resource: !GetAtt EcrRepository.Arn
                - PolicyName: dynamodb-codebase
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action:
                                - dynamodb:GetItem
                                - dynamodb:PutItem
                                - dynamodb:UpdateItem
                                - dynamodb:DeleteItem
                                - dynamodb:Query
                                - dynamodb:Scan
                            Resource:
                                - !GetAtt CodebaseTable.Arn
                                - !Sub "${CodebaseTable.Arn}/index/*"
                - PolicyName: cloudwatch-logs
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action:
                                - logs:CreateLogStream
                                - logs:PutLogEvents
                            Resource: !GetAtt LogGroup.Arn

    Ec2InstanceProfile:
        Type: AWS::IAM::InstanceProfile
        Properties:
            Roles:
                - !Ref Ec2Role

    # ---- Security Group ----
    SecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
            GroupDescription: !Sub "${AWS::StackName} EC2 security group"
            VpcId: !Ref VpcId
            SecurityGroupIngress:
                - IpProtocol: tcp
                  FromPort: 8080
                  ToPort: 8080
                  CidrIp: 0.0.0.0/0
                  Description: App port (dev - open to all)
                - IpProtocol: tcp
                  FromPort: 22
                  ToPort: 22
                  CidrIp: 0.0.0.0/0
                  Description: SSH (dev - open to all)
            Tags:
                - Key: Name
                  Value: !Sub "${AWS::StackName}-sg"

    # ---- EC2 Instance ----
    Ec2Instance:
        Type: AWS::EC2::Instance
        Properties:
            ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
            InstanceType: !Ref InstanceType
            KeyName: !Ref KeyPairName
            IamInstanceProfile: !Ref Ec2InstanceProfile
            SubnetId: !Ref SubnetId
            SecurityGroupIds:
                - !Ref SecurityGroup
            BlockDeviceMappings:
                - DeviceName: /dev/xvda
                  Ebs:
                      VolumeSize: 30
                      VolumeType: gp3
            Tags:
                - Key: Name
                  Value: !Ref AWS::StackName
            UserData:
                Fn::Base64: !Sub |
                    #!/bin/bash -xe
                    exec > >(tee /var/log/user-data.log) 2>&1

                    # Install Docker
                    dnf install -y docker
                    systemctl enable docker
                    systemctl start docker
                    usermod -aG docker ec2-user

                    # Install CloudWatch agent
                    dnf install -y amazon-cloudwatch-agent

                    # Configure CloudWatch agent for Docker logs
                    cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json << 'CWEOF'
                    {
                        "logs": {
                            "logs_collected": {
                                "files": {
                                    "collect_list": [
                                        {
                                            "file_path": "/var/lib/docker/containers/*/*.log",
                                            "log_group_name": "/ec2/${AWS::StackName}",
                                            "log_stream_name": "{instance_id}/docker",
                                            "retention_in_days": 14
                                        },
                                        {
                                            "file_path": "/var/log/user-data.log",
                                            "log_group_name": "/ec2/${AWS::StackName}",
                                            "log_stream_name": "{instance_id}/user-data",
                                            "retention_in_days": 14
                                        }
                                    ]
                                }
                            }
                        }
                    }
                    CWEOF
                    /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
                        -a fetch-config -m ec2 \
                        -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s

                    # Write startup script (used on boot and for manual restarts)
                    ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
                    REGION=${AWS::Region}
                    ECR_URI="$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/${AWS::StackName}"

                    cat > /home/ec2-user/start-container.sh << STARTEOF
                    #!/bin/bash
                    set -e

                    ACCOUNT_ID=\$(aws sts get-caller-identity --query Account --output text)
                    REGION=${AWS::Region}
                    ECR_URI="\$ACCOUNT_ID.dkr.ecr.\$REGION.amazonaws.com/${AWS::StackName}"

                    # ECR login
                    aws ecr get-login-password --region \$REGION | docker login --username AWS --password-stdin \$ACCOUNT_ID.dkr.ecr.\$REGION.amazonaws.com

                    # Pull latest image
                    docker pull \$ECR_URI:latest || { echo "No image in ECR yet. Push an image first."; exit 0; }

                    # Stop any existing container
                    docker stop spektrum 2>/dev/null || true
                    docker rm spektrum 2>/dev/null || true

                    # Run container
                    docker run -d \
                        --name spektrum \
                        --restart unless-stopped \
                        -p 8080:8080 \
                        -e PORT=8080 \
                        -e AWS_REGION=\$REGION \
                        -e CODEBASE_TABLE=${CodebaseTable} \
                        -e JIGJOY_API_ENDPOINT=${JigjoyApiEndpoint} \
                        \$ECR_URI:latest

                    echo "Container started successfully"
                    STARTEOF

                    chmod +x /home/ec2-user/start-container.sh
                    chown ec2-user:ec2-user /home/ec2-user/start-container.sh

                    # Try to pull and start the container (will gracefully skip if no image yet)
                    /home/ec2-user/start-container.sh

    # ---- Elastic IP ----
    ElasticIp:
        Type: AWS::EC2::EIP
        Properties:
            Domain: vpc
            Tags:
                - Key: Name
                  Value: !Sub "${AWS::StackName}-eip"

    EipAssociation:
        Type: AWS::EC2::EIPAssociation
        Properties:
            AllocationId: !GetAtt ElasticIp.AllocationId
            InstanceId: !Ref Ec2Instance

    # ---- CodeBuild Project ----
    CodeBuildRole:
        Type: AWS::IAM::Role
        Properties:
            RoleName: !Sub "${AWS::StackName}-codebuild-role"
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: codebuild.amazonaws.com
                      Action: sts:AssumeRole
            Policies:
                - PolicyName: codebuild-ecr
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action:
                                - ecr:GetAuthorizationToken
                            Resource: "*"
                          - Effect: Allow
                            Action:
                                - ecr:BatchGetImage
                                - ecr:GetDownloadUrlForLayer
                                - ecr:BatchCheckLayerAvailability
                                - ecr:PutImage
                                - ecr:InitiateLayerUpload
                                - ecr:UploadLayerPart
                                - ecr:CompleteLayerUpload
                            Resource: !GetAtt EcrRepository.Arn
                - PolicyName: codebuild-logs
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action:
                                - logs:CreateLogGroup
                                - logs:CreateLogStream
                                - logs:PutLogEvents
                            Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}*"
                - PolicyName: codebuild-secrets
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action:
                                - secretsmanager:GetSecretValue
                            Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:github-token-*"

    CodeBuildProject:
        Type: AWS::CodeBuild::Project
        Properties:
            Name: !Sub "${AWS::StackName}-build"
            Description: Build and push Docker image for spektrum
            ServiceRole: !GetAtt CodeBuildRole.Arn
            Artifacts:
                Type: NO_ARTIFACTS
            Source:
                Type: GITHUB
                Location: https://github.com/jigjoy-ai/spektrum.git
                BuildSpec: buildspec.yml
                ReportBuildStatus: true
            Environment:
                Type: LINUX_CONTAINER
                ComputeType: BUILD_GENERAL1_MEDIUM
                Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
                PrivilegedMode: true
                EnvironmentVariables:
                    - Name: AWS_DEFAULT_REGION
                      Value: !Ref AWS::Region
                    - Name: AWS_ACCOUNT_ID
                      Value: !Ref AWS::AccountId
                    - Name: IMAGE_REPO_NAME
                      Value: !Ref AWS::StackName
                    - Name: GITHUB_TOKEN
                      Type: SECRETS_MANAGER
                      Value: "github-token:token"

Outputs:
    ElasticIpAddress:
        Description: Public IP address of the EC2 instance
        Value: !Ref ElasticIp

    EcrRepositoryUri:
        Description: ECR repository URI
        Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrRepository}"

    CodebaseTableName:
        Description: DynamoDB Codebase table name
        Value: !Ref CodebaseTable
        Export:
            Name: !Sub "${AWS::StackName}-CodebaseTableName"

    InstanceId:
        Description: EC2 instance ID
        Value: !Ref Ec2Instance

    SpektrumEndpoint:
        Description: Spektrum HTTP endpoint
        Value: !Sub "http://${ElasticIp}:8080"
        Export:
            Name: !Sub "${AWS::StackName}-Endpoint"
